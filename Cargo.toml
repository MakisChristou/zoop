[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
repository = "https://github.com/MakisChristou/snoop-api"

[workspace.dependencies]
# Internal crates
snoop-proto = { path = "crates/snoop-proto" }
snoop-analytics = { path = "crates/snoop-analytics" }
snoop-config = { path = "crates/snoop-config" }
snoop-storage = { path = "crates/snoop-storage" }
snoop-core = { path = "crates/snoop-core" }
snoop-api = { path = "crates/snoop-api" }

# WHOOP 4/5/MG BLE protocol core (eugenehp/whoop-rs, Apache-2.0). Pinned; bump deliberately.
poop = { git = "https://github.com/eugenehp/whoop-rs", rev = "36e5be95e67e4f9eb78a1af062ee3fa26bdd8221", default-features = false }

# Errors / async
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-util = "0.7"

# Serialization / time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = { version = "0.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# Config (TOML only)
figment = { version = "0.10", features = ["toml", "env"] }

# HTTP API
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Store
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "derive",
    "tls-rustls",
    "postgres",
    "migrate",
    "chrono",
    "json",
] }

# CLI / logging / FFI
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = { version = "0.29", features = ["cli"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
