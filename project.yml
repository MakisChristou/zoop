name: Snoop
options:
  deploymentTarget:
    iOS: "17.0"
# Signing is personal: copy Config/Local.xcconfig.example to Config/Local.xcconfig
# (gitignored) and set SNOOP_TEAM_ID and SNOOP_BUNDLE_ID there.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(SNOOP_TEAM_ID)
    PRODUCT_BUNDLE_IDENTIFIER: $(SNOOP_BUNDLE_ID)
packages:
  SnoopECG:
    path: Packages/SnoopECG
  SnoopData:
    path: Packages/SnoopData
  SnoopHealth:
    path: Packages/SnoopHealth
  SnoopSync:
    path: Packages/SnoopSync
  SnoopProtocol:
    path: Packages/SnoopProtocol
  SnoopBattery:
    path: Packages/SnoopBattery
targets:
  Snoop:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: App/Snoop.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - package: SnoopECG
      - package: SnoopData
      - package: SnoopHealth
      - package: SnoopSync
      - package: SnoopProtocol
      - package: SnoopBattery
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "Imports weight measurements into Snoop and your Snoop server, and checks for existing weigh-ins."
        NSHealthUpdateUsageDescription: "Shares sleep, workouts, optional steps and weigh-ins recorded in Snoop with Apple Health."
        NSBluetoothAlwaysUsageDescription: "Connects to your WHOOP strap to read heart-rate and sensor data."
        UIBackgroundModes: [bluetooth-central]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  SnoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Snoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SNOOP_BUNDLE_ID).tests
  SnoopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Snoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SNOOP_BUNDLE_ID).uitests
schemes:
  Snoop:
    build:
      targets:
        Snoop: all
    test:
      targets:
        - SnoopTests
        - SnoopUITests
