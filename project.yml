name: Zoop
options:
  deploymentTarget:
    iOS: "26.0"
# Signing is personal: copy Config/Local.xcconfig.example to Config/Local.xcconfig
# (gitignored) and set ZOOP_TEAM_ID and ZOOP_BUNDLE_ID there.
# Legacy SNOOP_* signing keys remain supported for existing installations.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(ZOOP_TEAM_ID)
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 7
    PRODUCT_BUNDLE_IDENTIFIER: $(ZOOP_BUNDLE_ID)
packages:
  ZoopECG:
    path: Packages/ZoopECG
  ZoopTransport:
    path: Packages/ZoopTransport
  ZoopData:
    path: Packages/ZoopData
  ZoopHealth:
    path: Packages/ZoopHealth
  ZoopSync:
    path: Packages/ZoopSync
  ZoopProtocol:
    path: Packages/ZoopProtocol
  ZoopBattery:
    path: Packages/ZoopBattery
targets:
  Zoop:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - App
      - WidgetShared
    entitlements:
      path: App/Zoop.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(ZOOP_BUNDLE_ID).widgets"]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - target: ZoopWidgets
      - package: ZoopECG
      - package: ZoopTransport
      - package: ZoopData
      - package: ZoopHealth
      - package: ZoopSync
      - package: ZoopProtocol
      - package: ZoopBattery
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Zoop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WidgetGroup: group.$(ZOOP_BUNDLE_ID).widgets
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Geist-Regular.otf, Geist-Medium.otf, Geist-SemiBold.otf]
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "Imports weight measurements into Zoop and your Zoop server, and checks for existing weigh-ins."
        NSHealthUpdateUsageDescription: "Shares sleep, workouts, optional steps and weigh-ins recorded in Zoop with Apple Health."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Connects to the Zoop server you choose on your local network."
        NSBluetoothAlwaysUsageDescription: "Connects to your WHOOP strap to read heart-rate and sensor data."
        UIBackgroundModes: [bluetooth-central]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  ZoopWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, WidgetShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZOOP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(ZOOP_BUNDLE_ID).widgets"]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Zoop Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WidgetGroup: group.$(ZOOP_BUNDLE_ID).widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ZoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
      - Widgets/ZoopWidgetPanel.swift
      - WidgetShared
    dependencies:
      - target: Zoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(ZOOP_BUNDLE_ID).tests
  ZoopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Zoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(ZOOP_BUNDLE_ID).uitests
schemes:
  Zoop:
    build:
      targets:
        Zoop: all
    test:
      targets:
        - ZoopTests
        - ZoopUITests
