name: Snoop
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
# Signing is personal: copy Config/Local.xcconfig.example to Config/Local.xcconfig
# (gitignored) and set DEVELOPMENT_TEAM and PRODUCT_BUNDLE_IDENTIFIER there.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  Snoop:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Connects to your WHOOP strap to read heart-rate and sensor data."
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.snoop
