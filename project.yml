name: Snoop
options:
  bundleIdPrefix: com.makischristou
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""   # Apple Developer team ID
targets:
  Snoop:
    type: application
    platform: iOS
    sources:
      - App
      - path: Generated
        optional: true
    dependencies:
      - framework: SnoopFFI.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Connects to your WHOOP strap to read heart-rate and sensor data."
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makischristou.snoop
        OTHER_LDFLAGS: ["-lsnoop_ios_ffi"]
