name: Snoop
options:
  deploymentTarget:
    iOS: "17.0"
# Signing is personal: copy Config/Local.xcconfig.example to Config/Local.xcconfig
# (gitignored) and set SNOOP_TEAM_ID and SNOOP_BUNDLE_ID there.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(SNOOP_TEAM_ID)
    PRODUCT_BUNDLE_IDENTIFIER: $(SNOOP_BUNDLE_ID)
packages:
  SnoopProtocol:
    path: Packages/SnoopProtocol
targets:
  Snoop:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SnoopProtocol
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Connects to your WHOOP strap to read heart-rate and sensor data."
        UIBackgroundModes: [bluetooth-central]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
