name: iOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: iOS tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify build toolchain
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test pure Swift packages
        run: |
          for package in ZoopTransport ZoopProtocol ZoopSync ZoopBattery ZoopHealth ZoopData ZoopECG; do
            swift test --package-path "Packages/$package"
          done
      - name: Generate unsigned project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Build with concurrency warnings treated as errors
        run: xcodebuild -scheme Zoop -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Select test simulator
        run: |
          device=$(xcrun simctl create 'Zoop CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "ZOOP_SIMULATOR_ID=$device" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Test app state and cancellation
        run: |
          xcodebuild -scheme Zoop -destination "platform=iOS Simulator,id=$ZOOP_SIMULATOR_ID" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -parallel-testing-enabled NO -only-testing:ZoopTests test
      - name: Test synthetic UI flows
        run: bash tools/test-ui.sh
