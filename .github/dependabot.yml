version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server/crates/zoop
    schedule:
      interval: weekly
