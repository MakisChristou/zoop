[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
repository = "https://github.com/MakisChristou/snoop-api"

[workspace.dependencies]
# Internal crates
zoop-auth = { path = "crates/zoop-auth" }
zoop-proto = { path = "crates/zoop-proto" }
zoop-analytics = { path = "crates/zoop-analytics" }
zoop-config = { path = "crates/zoop-config" }
zoop-storage = { path = "crates/zoop-storage" }
zoop-core = { path = "crates/zoop-core" }
zoop-api = { path = "crates/zoop-api" }

# Passwords and opaque sessions
argon2 = "0.5"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"

# Errors / async
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-util = "0.7"

# Serialization / time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = { version = "0.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# Config (TOML only)
figment = { version = "0.10", features = ["toml", "env"] }

# HTTP API
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower = { version = "0.5", features = ["util"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

# Store
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "derive",
    "tls-rustls",
    "postgres",
    "migrate",
    "chrono",
    "json",
] }

# CLI / logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
