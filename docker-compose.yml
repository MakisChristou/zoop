# Local development services for snoop: Postgres only. Not for production.
name: snoop

services:
  # Postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and declares the
  # volume one level up, so the mount is /var/lib/postgresql.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snoop
      POSTGRES_PASSWORD: snoop
      POSTGRES_DB: snoop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snoop -d snoop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
